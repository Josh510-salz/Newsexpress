{% load static %}
{% load blog_tags %}
<! DOCTYPE html>
<html>
    <head>
        <title>{% block title %}{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'css/blog.css' %}">
    </head>
    <body>
        <div id="content">
            {% block content %}
            {% endblock %}
        </div>
        <div id="sidebar">
            <h2>Newsexpress</h2>
            <p>
                Experience the power of blogging!
                Josh has wriitten {% total_posts %} posts so far.
            </p>
            <h3>Latest posts</h3>
            {% show_latest_posts 3 %}
            {% block sidebar %}
            {% endblock %}
        </div>
    </body>
</html>
